<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" fill="none" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">MyArtifact Architecture Overview</title>
  <desc id="arch-desc">Claude Code, OpenAI Codex, and Google Antigravity publish artifacts via MCP, CLI, and Dropzone into the MyArtifact Sandboxed Visual Studio, backed by Local SQLite or Stateless Cloud (Postgres, R2/S3, RBAC).</desc>

  <defs>
    <pattern id="moss-dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D3CDBD" fill-opacity="0.7" />
    </pattern>
    <linearGradient id="stage-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4EADF" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#F7F4ED" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F8F1E3" stop-opacity="0.65" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#55684F" />
    </marker>
    <marker id="arrow-brass" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#9A7832" />
    </marker>
  </defs>

  <!-- Warm Moss Paper Canvas -->
  <rect x="2" y="2" width="1196" height="306" rx="16" fill="#F7F4ED" stroke="#D3CDBD" stroke-width="1.5" />
  <rect x="2" y="2" width="1196" height="306" rx="16" fill="url(#stage-glow)" />
  <rect x="2" y="2" width="1196" height="306" rx="16" fill="url(#moss-dots)" />

  <!-- Subtle Header Eyebrow -->
  <text x="36" y="34" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.4" fill="#485A43">MULTI-AGENT VISUAL PIPELINE · LOCAL &amp; CLOUD</text>
  <rect x="1038" y="18" width="128" height="22" rx="11" fill="#E4EADF" stroke="#C7D3C0" />
  <circle cx="1053" cy="29" r="3.5" fill="#55684F" />
  <text x="1064" y="33" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#334530">MIT · v1.0.0</text>

  <!-- COLUMN 1: CODING AGENTS -->
  <g transform="translate(36, 54)">
    <rect width="222" height="226" rx="12" fill="#FCFBF7" stroke="#D3CDBD" stroke-width="1.2" />
    <text x="16" y="26" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1" fill="#535A50">01 · CODING AGENTS</text>

    <!-- Claude Code -->
    <g transform="translate(14, 42)">
      <rect width="194" height="48" rx="9" fill="#F8F1E3" stroke="#EADBB8" />
      <circle cx="20" cy="24" r="5" fill="#C8A96B" />
      <text x="34" y="22" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1E2420">Claude Code</text>
      <text x="34" y="38" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#634E22">.claude/skills + .mcp.json</text>
    </g>

    <!-- OpenAI Codex -->
    <g transform="translate(14, 102)">
      <rect width="194" height="48" rx="9" fill="#EEF2EA" stroke="#C7D3C0" />
      <circle cx="20" cy="24" r="5" fill="#6F8A69" />
      <text x="34" y="22" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1E2420">OpenAI Codex</text>
      <text x="34" y="38" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#334530">.agents/skills + CLI/MCP</text>
    </g>

    <!-- Google Antigravity -->
    <g transform="translate(14, 162)">
      <rect width="194" height="48" rx="9" fill="#E1E8EE" stroke="#C2D0DC" />
      <circle cx="20" cy="24" r="5" fill="#6C859C" />
      <text x="34" y="22" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#1E2420">Google Antigravity</text>
      <text x="34" y="38" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#334658">~/.gemini/config + MCP</text>
    </g>
  </g>

  <!-- Arrows Col 1 -> Col 2 -->
  <path d="M 260 167 L 296 167" stroke="#55684F" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- COLUMN 2: UNIFIED AGENT BRIDGE -->
  <g transform="translate(302, 54)">
    <rect width="234" height="226" rx="12" fill="#FCFBF7" stroke="#D3CDBD" stroke-width="1.2" />
    <text x="16" y="26" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1" fill="#535A50">02 · UNIFIED BRIDGE</text>

    <g transform="translate(14, 42)">
      <rect width="206" height="42" rx="8" fill="#EFEBE1" stroke="#E2DDD0" />
      <text x="12" y="19" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1E2420">MCP Stdio Server</text>
      <text x="12" y="34" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#485A43">myartifact mcp · 8 tools</text>
    </g>

    <g transform="translate(14, 92)">
      <rect width="206" height="42" rx="8" fill="#EFEBE1" stroke="#E2DDD0" />
      <text x="12" y="19" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#1E2420">CLI &amp; Dropzone Watcher</text>
      <text x="12" y="34" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" fill="#4A524A">push / tb log / watch / export</text>
    </g>

    <!-- Safe Agent Scope Ceiling Highlight -->
    <g transform="translate(14, 144)">
      <rect width="206" height="66" rx="8" fill="#F8F1E3" stroke="#C8A96B" stroke-dasharray="4 3" />
      <text x="12" y="20" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#664F21">SAFE AGENT SCOPE CEILING</text>
      <text x="12" y="37" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#4E3E1C">✓ read / write / kv / tensorboard</text>
      <text x="12" y="53" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#6E2E20">✕ delete &amp; ACL share (--elevate)</text>
    </g>
  </g>

  <!-- Arrows Col 2 -> Col 3 -->
  <path d="M 538 167 L 574 167" stroke="#55684F" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- COLUMN 3: VISUAL ARTIFACT STUDIO -->
  <g transform="translate(580, 54)">
    <rect width="318" height="226" rx="12" fill="#151A16" stroke="#2D352E" stroke-width="1.5" />
    <text x="18" y="26" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1" fill="#98AC93">03 · MYARTIFACT STUDIO UI</text>
    <rect x="234" y="12" width="68" height="20" rx="5" fill="#2A352B" stroke="#3E4C3B" />
    <text x="245" y="25" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" font-weight="600" fill="#C7D3C0">7 runtimes</text>

    <!-- Runtime pills grid -->
    <g transform="translate(16, 42)">
      <rect width="138" height="44" rx="8" fill="#1D231E" stroke="#3A443B" />
      <text x="12" y="20" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#ECEAE3">React + Recharts</text>
      <text x="12" y="35" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#98AC93">Babel · Tailwind v4</text>

      <rect x="148" width="138" height="44" rx="8" fill="#1D231E" stroke="#3A443B" />
      <text x="160" y="20" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#ECEAE3">Three.js WebGL2</text>
      <text x="160" y="35" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#E0C68E">R3F · OrbitControls</text>
    </g>

    <g transform="translate(16, 94)">
      <rect width="138" height="44" rx="8" fill="#1D231E" stroke="#3A443B" />
      <text x="12" y="20" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#ECEAE3">TensorBoard Runs</text>
      <text x="12" y="35" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#93A9BD">.tfevents + Checkpoints</text>

      <rect x="148" width="138" height="44" rx="8" fill="#1D231E" stroke="#3A443B" />
      <text x="160" y="20" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#ECEAE3">Mermaid · KaTeX</text>
      <text x="160" y="35" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#A6ADA2">HTML · SVG · Code</text>
    </g>

    <!-- Studio Core Capabilities Strip -->
    <g transform="translate(16, 148)">
      <rect width="286" height="62" rx="8" fill="#1F2A20" stroke="#485A43" />
      <text x="12" y="20" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#E0C68E">v1..vN DIFFS · WINDOW.STORAGE · LLM WIKI</text>
      <text x="12" y="37" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#ECEAE3">⌘K Command Palette · 1-Click Rollback</text>
      <text x="12" y="53" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#98AC93">index.md + [[wiki-links]] + Standalone Export</text>
    </g>
  </g>

  <!-- Arrows Col 3 -> Col 4 -->
  <path d="M 900 118 L 938 118" stroke="#55684F" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 900 218 L 938 218" stroke="#9A7832" stroke-width="1.8" marker-end="url(#arrow-brass)" />

  <!-- COLUMN 4: STORAGE MODES -->
  <g transform="translate(944, 54)">
    <!-- Local Mode -->
    <rect width="220" height="106" rx="12" fill="#FCFBF7" stroke="#55684F" stroke-width="1.3" />
    <text x="14" y="24" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="0.8" fill="#485A43">LOCAL OFFLINE MODE</text>
    <text x="14" y="47" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1E2420">SQLite FTS5 + Disk</text>
    <text x="14" y="66" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#4A524A">~/.myartifact + WebSocket HMR</text>
    <rect x="14" y="76" width="118" height="20" rx="5" fill="#E4EADF" />
    <text x="22" y="90" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" font-weight="600" fill="#334530">myartifact serve</text>

    <!-- Cloud Mode -->
    <g transform="translate(0, 120)">
      <rect width="220" height="106" rx="12" fill="#FCFBF7" stroke="#C8A96B" stroke-width="1.3" />
      <text x="14" y="24" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="0.8" fill="#7A612E">SERVERLESS CLOUD</text>
      <text x="14" y="47" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1E2420">Postgres + S3/R2 + RBAC</text>
      <text x="14" y="66" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#4A524A">Google OIDC · Batch Share Links</text>
      <rect x="14" y="76" width="144" height="20" rx="5" fill="#F8F1E3" />
      <text x="22" y="90" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" font-weight="600" fill="#664F21">myartifact login ($0/mo)</text>
    </g>
  </g>
</svg>
