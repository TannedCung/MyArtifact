services:
  myartifact:
    build:
      context: .
      dockerfile: Dockerfile
    image: myartifact:latest
    container_name: myartifact
    restart: unless-stopped
    ports:
      - "${MYARTIFACT_PORT:-4175}:4173"
    environment:
      - NODE_ENV=production
      - MYARTIFACT_HOME=/data
      - MYARTIFACT_HOST=0.0.0.0
      - MYARTIFACT_PORT=4173
    volumes:
      - ${MYARTIFACT_DATA_DIR:-~/.myartifact}:/data
