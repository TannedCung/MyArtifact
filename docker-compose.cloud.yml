services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: myartifact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: myartifact
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myartifact -d myartifact"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}; do sleep 1; done;
      mc mb -p local/myartifact-blobs || true;
      exit 0;
      "

  myartifact-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: myartifact:cloud
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MYARTIFACT_CLOUD_PORT:-4173}:4173"
    environment:
      NODE_ENV: production
      MYARTIFACT_MODE: cloud
      MYARTIFACT_HOST: 0.0.0.0
      MYARTIFACT_PORT: 4173
      MYARTIFACT_HOME: /data
      MYARTIFACT_PUBLIC_URL: ${MYARTIFACT_PUBLIC_URL:-http://127.0.0.1:4173}
      MYARTIFACT_COOKIE_SECRET: ${MYARTIFACT_COOKIE_SECRET:?Set MYARTIFACT_COOKIE_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MYARTIFACT_S3_ENDPOINT: http://minio:9000
      MYARTIFACT_S3_PUBLIC_ENDPOINT: ${MYARTIFACT_S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      MYARTIFACT_S3_BUCKET: myartifact-blobs
      MYARTIFACT_S3_REGION: us-east-1
      MYARTIFACT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MYARTIFACT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MYARTIFACT_S3_FORCE_PATH_STYLE: "true"
    volumes:
      - clouddata:/data
    command: ["node", "dist/cli/cli.js", "serve", "--cloud", "--host", "0.0.0.0", "--port", "4173", "--data-dir", "/data"]

volumes:
  pgdata:
  miniodata:
  clouddata:
