<!DOCTYPE html>

    <meta charset="UTF-8" />

    <meta
      name="twitter:title"
      content="MyArtifact — Visual Artifact Studio &amp; MCP Server for Claude Code, Codex &amp; Antigravity"

    <!-- Synchronous theme detection to eliminate FOUC -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('ma-studio-theme');
          if (s === 'night' || s === 'day') {
            document.documentElement.dataset.theme = s;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.dataset.theme = 'night';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Non-blocking Fonts (display=optional guarantees 0.000 CLS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=optional"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=optional"
      />
    </noscript>

    <!-- Critical Above-the-Fold Styles for Wave-1 HTML & Zero-CLS Centered Hero -->
    <style>
      .ma-pre { background:#F7F4ED; color:#1E2420; min-height:100vh; font-family:system-ui,-apple-system,sans-serif; }
      :root[data-theme="night"] .ma-pre { background:#151A16; color:#ECEAE3; }
      .ma-pre-hdr { height:60px; border-bottom:1px solid #E2DDD0; display:flex; align-items:center; justify-content:space-between; max-width:1120px; margin:0 auto; padding:0 24px; }
      :root[data-theme="night"] .ma-pre-hdr { border-color:#2D352E; }
      .ma-pre-main { max-width:1120px; margin:0 auto; padding:64px 24px 40px; text-align:center; display:flex; flex-direction:column; align-items:center; }
      .ma-pre-pill { display:inline-flex; align-items:center; gap:8px; padding:4px 12px; border-radius:999px; font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; font-family:ui-monospace,monospace; background:#FCFBF7; color:#485A43; border:1px solid #E2DDD0; margin-bottom:24px; }
      :root[data-theme="night"] .ma-pre-pill { background:#1D231E; color:#98AC93; border-color:#2D352E; }
      .ma-pre-h1 { font-family:Georgia,serif; font-size:clamp(36px,5vw,54px); line-height:1.08; letter-spacing:-0.025em; font-weight:600; margin:0; max-width:820px; }
      .ma-pre-p { margin:20px auto 0; font-size:17px; line-height:1.6; max-width:600px; color:#4A524A; }
      :root[data-theme="night"] .ma-pre-p { color:#B5BCB0; }
      .ma-pre-cta { display:inline-flex; align-items:center; justify-content:center; height:44px; padding:0 20px; border-radius:9px; background:#485A43; color:#F7F4ED; font-weight:500; font-size:14px; text-decoration:none; margin-top:32px; }
      :root[data-theme="night"] .ma-pre-cta { background:#98AC93; color:#151A16; }
    </style>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://myartifact.app/#organization",
            "name": "MyArtifact",
            "url": "https://myartifact.app/",
            "logo": {
              "@type": "ImageObject",
              "url": "__SITE_ORIGIN__/apple-touch-icon.png",
              "width": 180,
              "height": 180
            },
            "sameAs": [
              "https://github.com/TannedCung/MyArtifact"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://myartifact.app/#website",
            "url": "https://myartifact.app/",
            "name": "MyArtifact",
            "description": "Local-first & serverless cloud visual artifact studio and MCP server for Claude Code, OpenAI Codex, and Google Antigravity.",
            "publisher": { "@id": "https://myartifact.app/#organization" },
            "inLanguage": "en-US"
          },
          {
            "@type": "BreadcrumbList",
            "@id": "https://myartifact.app/#breadcrumb",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Home",
                "item": "https://myartifact.app/"
              }
            ]
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://myartifact.app/#software",
            "name": "MyArtifact",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "macOS, Linux, Windows, Web",
            "softwareVersion": "1.0.0",
            "license": "https://opensource.org/licenses/MIT",
            "url": "https://myartifact.app/",
            "downloadUrl": "https://github.com/TannedCung/MyArtifact",
            "screenshot": "__SITE_ORIGIN__/og-image.png",
            "publisher": { "@id": "https://myartifact.app/#organization" },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "author": {
              "@type": "Person",
              "name": "TannedCung",
              "url": "https://github.com/TannedCung"
            },
            "featureList": [
              "Sandboxed React 19, Recharts, Tailwind CSS, Three.js / React Three Fiber, Mermaid, Markdown/KaTeX, SVG, and HTML runtimes",
              "Cross-assistant Model Context Protocol (MCP) server for Claude Code, OpenAI Codex, and Google Antigravity",
              "Immutable v1, v2, v3 artifact checkpoint timeline, side-by-side unified diffs, and 1-click rollback",
              "Persistent window.storage key-value state with Viewer Copy-on-Write isolation",
              "Karpathy-pattern LLM Wiki index (index.md & log.md) with bidirectional [[wiki-links]] and full-text search",
              "Native TensorBoard .tfevents scalar visualization and S3/R2 SigV4 pre-signed model checkpoints",
              "Google OIDC sign-in with cascading Workspace -> Project -> Category -> Artifact RBAC and batch sharing",
              "One-time CLI login (myartifact login) enforcing a Safe Agent Scope Ceiling"
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "https://myartifact.app/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How is MyArtifact different from chat-locked Claude or GPT Artifacts?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "MyArtifact decouples visual artifacts from any single chat thread. Claude Code can build v1, OpenAI Codex can iterate v2 with diffs, and Google Antigravity can log TensorBoard metrics to v3 inside one permanent, searchable workspace accessible locally or on the cloud."
                }
              },
              {
                "@type": "Question",
                "name": "Can I run MyArtifact 100% offline without cloud accounts?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Running npx myartifact setup and myartifact serve stores all metadata, versions, and window.storage state locally in ~/.myartifact using Node SQLite FTS5 and human-readable files on disk with zero external network dependencies for core local workflows."
                }
              },
              {
                "@type": "Question",
                "name": "How do local coding agents safely access Cloud workspaces?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Run myartifact login once via Google OIDC. Local CLI and MCP tools inherit your RBAC role under a Safe Agent Scope Ceiling that blocks deletes and sharing changes unless --elevate is passed."
                }
              },
              {
                "@type": "Question",
                "name": "How does cascading RBAC and Batch Sharing work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Roles cascade across Workspace -> Project -> Category -> Artifact (with optional private projects), and Batch Sharing grants access across emails, workspace groups, verified Google domains, or expiring links."
                }
              },
              {
                "@type": "Question",
                "name": "What does it cost to self-host MyArtifact Cloud?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "MyArtifact is MIT-licensed and runs at $0/month on Vercel Hobby serverless functions (using conditional ETag /api/sync), Neon Free Postgres, and Cloudflare R2."
                }
              }
            ]
          }
        ]
      }
